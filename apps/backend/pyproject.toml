[project]
name = "group-raiding"
version = "0.1.0"
description = "Discord bot and guild tooling for Presynaptic"
readme = "../../README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "py-cord>=2.4.1,<3",
    # SQLAlchemy 2.1 changes the default DBAPI for postgresql:// URLs from
    # psycopg2 to psycopg; keep the existing application's driver behavior.
    "sqlalchemy>=2.0.19,<2.1",
    "python-graphql-client>=0.4.3,<0.5",
    "requests>=2.31.0,<3",
    "apscheduler>=3.10.4,<4",
    "python-dotenv>=1.0.0,<2",
    "psycopg2-binary>=2.9.9,<3",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3.5,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[project]
name = "group-raiding"
version = "0.1.0"
description = "Discord bot for guild/admin utilities and a lightweight in-server economy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Nelson", email = "andrew@daleego.com" }]
dependencies = [
  "py-cord>=2.4.1,<3.0.0",
  "sqlalchemy>=2.0.19,<3.0.0",
  "python-graphql-client>=0.4.3,<1.0.0",
  "requests-oauthlib>=1.3.1,<2.0.0",
  "requests>=2.31.0,<3.0.0",
  "apscheduler>=3.10.4,<4.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "psycopg2-binary>=2.9.9,<3.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.4.0,<1.0.0",
  "black>=24.0.0,<26.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
